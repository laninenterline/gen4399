[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gen4399"
version = "1.8.1"
description = "生成与校验符合 4399 注册规则的密码与账号名"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "gen4399" }]
keywords = ["4399", "password", "generator", "validator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
]

[project.scripts]
gen4399 = "gen4399.cli:main"

[tool.setuptools.packages.find]
include = ["gen4399*"]

[tool.setuptools.package-data]
gen4399 = ["py.typed"]
