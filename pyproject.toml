[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gen4399"
dynamic = ["version"]
description = "生成与校验符合 4399 注册规则的密码与账号名"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gen4399" }]
keywords = ["4399", "password", "generator", "validator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]

[project.scripts]
gen4399 = "gen4399.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "coverage[toml]>=7",
    "ruff>=0.6",
    "mypy>=1.8",
]

[tool.setuptools.dynamic]
version = { attr = "gen4399.__version__" }

[tool.setuptools.packages.find]
include = ["gen4399*"]

[tool.setuptools.package-data]
gen4399 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["gen4399"]

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.8"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
