name: android

on:
  push:
    branches: [main]
    paths: ['apk/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['apk/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK 组件
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;4.1.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > apk/local.properties

      - name: 安装 Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.0"

      - name: 生成临时签名（仅用于 CI 产物安装）
        working-directory: apk
        run: |
          mkdir -p keystore
          keytool -genkeypair -keystore keystore/ci.jks -storepass cipass -keypass cipass \
            -alias ci -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=gen4399-ci, O=gen4399, C=CN"
          cat > keystore.properties <<'PROPS'
          storeFile=keystore/ci.jks
          storePassword=cipass
          keyAlias=ci
          keyPassword=cipass
          PROPS

      - name: 编译 release APK
        working-directory: apk
        run: gradle assembleRelease --no-daemon --console=plain

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: gen4399-release-apk
          path: apk/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 编译 native 自测
        working-directory: ports/c
        run: make test
