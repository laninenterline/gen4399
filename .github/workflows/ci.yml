name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy，先作为观察项)
        continue-on-error: true
        run: mypy gen4399

      - name: Test (pytest)
        run: python -m pytest

      - name: Coverage (阈值 90%)
        run: |
          python -m coverage run --branch -m pytest -q
          python -m coverage report --show-missing

      - name: Doctest
        run: python -m pytest --doctest-modules gen4399 -q

      - name: Build sdist + wheel
        run: |
          python -m build
          python -m twine check dist/*

  ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Node 移植版（测试 + CLI 冒烟）
        run: |
          cd ports/node
          node --test test.mjs
          node cli.mjs generate -n 12
          node cli.mjs check password Abc12345

      - name: 安装 C 依赖
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libssl-dev

      - name: C 移植版（构建 + 自测）
        run: |
          cd ports/c
          make
          make test
