// Groovy DSL：AGP 9 的 kotlin { compilerVersion } 是 experimental API，
// Kotlin DSL 需要 opt-in，Groovy 没有这个限制。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// release 签名：keystore.properties 不入库
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = 'io.gen4399.app'
    compileSdk = 37

    defaultConfig {
        applicationId = 'io.gen4399.app'
        minSdk = 24
        targetSdk = 37
        versionCode = 23
        versionName = '1.16.0'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile = rootProject.file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
    }

    // C 实现的协议内核（libgen4399.so），Kotlin 只负责界面与 HTTP
    ndkVersion = '29.0.14206865'
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '4.1.0'
        }
    }

    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerVersion = '2.4.20'
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.08.00')

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.core:core-ktx:1.19.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
