// Groovy DSL：AGP 9 的 kotlin { compilerVersion } 是 experimental API，
// Kotlin DSL 需要 opt-in，Groovy 没有这个限制。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// release 签名：keystore.properties 不入库
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = 'io.gen4399.app'
    // CI 上可通过 -PcompileSdk=36 覆盖（android-37 还没进公开 SDK 仓库）
    compileSdk = (project.findProperty('compileSdk') ?: '37').toString().toInteger()

    defaultConfig {
        applicationId = 'io.gen4399.app'
        minSdk = 24
        targetSdk = (project.findProperty('targetSdk') ?: '37').toString().toInteger()
        versionCode = 30
        versionName = '1.19.1'
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                storeFile = rootProject.file(keystoreProps['storeFile'])
                storePassword = keystoreProps['storePassword']
                keyAlias = keystoreProps['keyAlias']
                keyPassword = keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
            if (keystoreFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose = true
    }

    // C 实现的协议内核（libgen4399.so），Kotlin 只负责界面与 HTTP
    ndkVersion = (project.findProperty('ndkVersion') ?: '29.0.14206865').toString()
    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = (project.findProperty('cmakeVersion') ?: '4.1.0').toString()
        }
    }

    defaultConfig {
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerVersion = '2.4.20'
}

def buildSdk = (project.findProperty('compileSdk') ?: '37').toString().toInteger()

// compileSdk 低于 37 时（CI 环境），把要求更高 SDK 的库压回可用版本
if (buildSdk < 37) {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.15.0'
            force 'androidx.core:core-ktx:1.15.0'
        }
    }
}

dependencies {
    // CI 上用 -PcomposeBom=2025.06.01（那版 Compose 只需要 compileSdk 36）
    implementation platform("androidx.compose:compose-bom:${project.findProperty('composeBom') ?: '2026.08.00'}")

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation buildSdk >= 37 ? 'androidx.core:core-ktx:1.19.0' : 'androidx.core:core-ktx:1.15.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
