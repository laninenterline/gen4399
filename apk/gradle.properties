org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# 本机（Termux/proot）的 aapt2 是 box64 包装的 x86_64 二进制，需要指定；
# 该路径不存在时（如 CI）由 AGP 自行下载，所以这里注释掉，本机构建用
# -Pandroid.aapt2FromMavenOverride=... 或在 gradle.properties.local 里覆盖。
# android.aapt2FromMavenOverride=/root/android-sdk/build-tools/36.1.0/aapt2
